<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blog Post API - Project Proposal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f4f8, #d9e4ec);
            color: #333;
        }

        header {
            background: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 2.2em;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        ul li {
            background: #ecf0f1;
            margin: 8px 0;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        ul li:hover {
            background: #d0d7de;
        }
    </style>
</head>

<body>
    <header>
        <h1>Blog Post API</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>Collections</h2>
            <ul>
                <li>Users || To access list of users, <a
                        href="https://cse341-week3-personal-project.onrender.com/users">click
                        here!</a></li>
                <li>Posts </li>
            </ul>
        </div>

        <div class="card">
            <h2>Features</h2>
            <ul>
                <li>Sign up / Log in (OAuth)</li>
                <li>Create, Read, Update, Delete posts</li>
                <li>Edit profile (basic user info: profile and posts)</li>
            </ul>
        </div>
    </div>
</body>

</html>
